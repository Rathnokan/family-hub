# Family Hub — Continuous Integration
#
# Runs on GitHub's servers on every push / PR. Catches the errors that today
# only surface on a live HA reload — BEFORE anything reaches the family dashboard:
#   • Python syntax / indentation errors
#   • Undefined names (the "silent ReferenceError" class, e.g. a missed import)
#   • JS bundle breaks
#
# No Home Assistant install required for these checks, so it's fast (~1-2 min).
# Next step (bigger win): add pytest + unit tests for the tick / migration logic.
name: CI

on:
  push:
  pull_request:

# Cancel an in-progress run when you push again to the same branch (saves minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile-check (syntax / indentation)
        run: python -m compileall -q custom_components
      - name: Lint — critical bug rules only (no style nags)
        run: |
          python -m pip install --quiet ruff
          # E9 = syntax errors, F63/F7 = misc real bugs, F82 = undefined name.
          ruff check --select E9,F63,F7,F82 custom_components

  build:
    name: Card build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      # esbuild's binary occasionally installs without the +x bit on Linux
      # runners (works fine on Windows dev machines) — ensure it's executable.
      - name: Ensure esbuild is executable
        run: chmod +x node_modules/.bin/esbuild node_modules/esbuild/bin/esbuild node_modules/@esbuild/*/bin/* 2>/dev/null || true
      - run: npm run build
