# Family Hub — service descriptions for Dev Tools → Actions.
# Most services are driven by the dashboard card; the ones with input fields
# below are the ones you might reasonably call by hand.

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------
complete_task:
  name: Complete task
  description: Mark a task instance complete (kid self-report or parent on their behalf).
  fields:
    task_id:
      name: Task ID
      description: The task instance ID.
      required: true
      selector:
        text:
    person_id:
      name: Person ID
      description: The person completing it (optional).
      selector:
        text:
claim_task:
  name: Claim task
  description: Claim a task from the claimable/bonus pool.
approve_task:
  name: Approve task
  description: >-
    Parent approval of a completed task; awards its points. Optional
    credit_fraction (0-1] grants partial credit (e.g. 0.5 = 50% of the points).
    For a late make-up claim, approval also refunds the original skip penalty.
deny_task:
  name: Deny task
  description: Parent denial of a completed task; returns it to pending.
claim_late_task:
  name: Claim late task
  description: >-
    Kid claims a previously-skipped chore late. Moves it into the approval queue
    (always requires parent approval, partial-eligible); on approval the skip
    penalty is refunded and the (partial) points awarded.
excuse_task:
  name: Excuse task
  description: Excuse a skipped task and reverse its penalty (sick day, etc.).
excuse_day:
  name: Excuse day
  description: Excuse every still-skipped chore for one person on a given day (ISO date) in one action.
reject_task:
  name: Reject task
  description: Claw back points on an approved or self-reported task.
mark_task_complete:
  name: Mark task complete
  description: Retroactively mark a skipped instance as done and award points.
add_task:
  name: Add one-time task
  description: >-
    Create a one-time task (not a recurring chore). Optionally expires after N days,
    with an optional penalty deducted if it expires unfinished.
  fields:
    name:
      name: Task name
      required: true
      selector:
        text:
    assigned_to:
      name: Assign to
      description: One or more person IDs.
      selector:
        text:
    points:
      name: Points
      selector:
        number:
          min: 0
          mode: box
    description:
      name: Description
      selector:
        text:
    approval_required:
      name: Needs approval
      selector:
        boolean:
    expires_after_days:
      name: Expires after (days)
      description: Auto-skip the task this many days after creation. Blank = never expires.
      selector:
        number:
          min: 1
          mode: box
    penalty_enabled:
      name: Apply penalty on expiry
      description: Deduct points if the task expires unfinished (needs an expiry window).
      selector:
        boolean:
    penalty_points:
      name: Penalty points
      selector:
        number:
          min: 0
          mode: box
    created_by:
      name: Created by
      selector:
        text:
add_one_time_task:
  name: Add one-time task (alias)
  description: Backward-compatible alias of add_task — identical fields.

# ---------------------------------------------------------------------------
# People
# ---------------------------------------------------------------------------
add_person:
  name: Add person
  description: Add a family member.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
    person_type:
      name: Type
      description: parent or kid.
      selector:
        select:
          options: ["parent", "kid"]
    avatar_color:
      name: Avatar color
      selector:
        text:
update_person:
  name: Update person
  description: >-
    Update a person's settings (name, theme, allowance, active flag, etc.). Rank
    tuning accepts rank_index plus per-rank curves rank_drop_thresholds /
    rank_gain_thresholds (length-5 lists, indexed by rank) and rank_curve (the
    remembered generator knobs). Pass null for a curve list to fall back to the
    legacy scalar / global threshold.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
    checklist_notify:
      name: Phone checklist notification
      description: >-
        Turn the quiet "today's chores" home-screen / lock-screen notification
        on or off for this person. Requires their notify_target to be set to
        their phone. Off by default.
      selector:
        boolean:
remove_person:
  name: Deactivate person
  description: Soft-remove (deactivate) a person. Hidden from dashboards; history preserved. Reversible via Reactivate.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
reactivate_person:
  name: Reactivate person
  description: Bring a deactivated person back (e.g. home from camp). Recreates their sensor.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
hard_delete_person:
  name: Permanently delete person
  description: >-
    Permanently remove an INACTIVE person and purge all their data (task instances,
    redemptions, subscriptions, history, group contributions). Irreversible. Active
    people are refused — deactivate first.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:

# ---------------------------------------------------------------------------
# Chores
# ---------------------------------------------------------------------------
add_chore:
  name: Add chore
  description: Create a chore definition.
update_chore:
  name: Update chore
  description: Update a chore definition (incl. the active toggle).
delete_chore:
  name: Delete chore
  description: Permanently delete a chore and purge all of its task instances.

# ---------------------------------------------------------------------------
# Store / rewards
# ---------------------------------------------------------------------------
add_store_item:
  name: Add store item
  description: Add a reward to the store.
update_store_item:
  name: Update store item
  description: Update a store item (incl. the active toggle).
delete_store_item:
  name: Deactivate store item
  description: Soft-deactivate a store item (kept for historical redemptions).
hard_delete_store_item:
  name: Permanently delete store item
  description: Permanently remove a store item, cancel pending redemptions, and refund group chip-ins.

# ---------------------------------------------------------------------------
# Group rewards
# ---------------------------------------------------------------------------
propose_group_reward:
  name: Propose group reward
  description: Kid-initiated proposal to share a reward.
respond_group_proposal:
  name: Respond to group proposal
  description: A kid accepts or declines a group-reward proposal.
approve_group_proposal:
  name: Approve group proposal
  description: Parent approval of a group-reward proposal.
decline_group_proposal:
  name: Decline group proposal
  description: Parent declines a group-reward proposal.
chip_in_group_reward:
  name: Chip in to group reward
  description: A kid contributes points toward a group reward.
redeem_group_reward:
  name: Redeem group reward
  description: Redeem a fully-funded group reward.

# ---------------------------------------------------------------------------
# Redemptions
# ---------------------------------------------------------------------------
request_redemption:
  name: Request redemption
  description: Kid requests to spend points on a reward.
approve_redemption:
  name: Approve redemption
  description: Parent approves a redemption and deducts the points.
decline_redemption:
  name: Decline redemption
  description: Parent declines a pending redemption.

# ---------------------------------------------------------------------------
# Points
# ---------------------------------------------------------------------------
award_bonus_points:
  name: Award bonus points
  description: Manually award points to a person.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
    points:
      name: Points
      required: true
      selector:
        number:
          min: 1
          mode: box
deduct_points:
  name: Deduct points
  description: Manually deduct points from a person.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
    points:
      name: Points
      required: true
      selector:
        number:
          min: 1
          mode: box

# ---------------------------------------------------------------------------
# Settings / admin
# ---------------------------------------------------------------------------
update_settings:
  name: Update settings
  description: Update global settings (family name, points-per-dollar, penalty pause, ranks, etc.).
force_daily_tick:
  name: Force daily tick
  description: Run the daily tick immediately (generate instances, process penalties/allowances, advance rotations). For testing/admin.
rebuild_data:
  name: Rebuild data
  description: >-
    Cleanup tool — remove orphan people, ghost/orphaned/duplicate task instances,
    and prune old terminal instances + history. Surfaces a summary notification.
set_streak:
  name: Set chore streak
  description: Admin-override a per-chore streak count for a person.
set_completion_streak:
  name: Set success-rate streak
  description: Admin-override a person's daily success-rate streak count.
set_rank:
  name: Set rank
  description: Admin-set a person's rank index.
  fields:
    person_id:
      name: Person ID
      required: true
      selector:
        text:
    rank_index:
      name: Rank index
      required: true
      selector:
        number:
          min: 0
          mode: box
export_backup:
  name: Export backup
  description: Write a full JSON backup of all Family Hub data to a path.
  fields:
    export_path:
      name: Export path
      description: Absolute file path to write the backup to.
      required: true
      selector:
        text:

export_data:
  name: Export data (versioned)
  description: >-
    Write a schema-stamped export of ALL Family Hub data (every module, even
    disabled ones). Portable across future versions via import_data.
  fields:
    path:
      name: Path
      description: >-
        Absolute file path to write to. Leave blank to auto-name under
        config/family_hub_backups/.
      required: false
      selector:
        text:

import_data:
  name: Import data (versioned)
  description: >-
    Import a Family Hub export, migrating it forward if needed. Backs up current
    data first, verifies collection counts (history must match exactly), then
    swaps atomically. Fails safe — the live store is untouched on any error.
  fields:
    path:
      name: Path
      description: Absolute path of the export file to import.
      required: true
      selector:
        text:
    dry_run:
      name: Dry run
      description: Validate and report only — make no changes.
      required: false
      selector:
        boolean:

# ---------------------------------------------------------------------------
# Subscriptions
# ---------------------------------------------------------------------------
subscribe:
  name: Subscribe
  description: Kid subscribes to a recurring-reward store item.
request_cancel_subscription:
  name: Request cancel subscription
  description: Kid requests to cancel a subscription (needs parent approval).
approve_cancel_subscription:
  name: Approve cancel subscription
  description: Parent approves a subscription cancellation.
decline_cancel_subscription:
  name: Decline cancel subscription
  description: Parent declines a subscription cancellation request.
admin_cancel_subscription:
  name: Cancel subscription (admin)
  description: Parent cancels a subscription unilaterally.
update_subscription:
  name: Update subscription
  description: Edit a subscription (period, dollar-cost override, next renewal date).
admin_subscribe_for_person:
  name: Subscribe for person (admin)
  description: Parent starts a subscription on a kid's behalf.

# ---------------------------------------------------------------------------
# Meals room (v0.8.0) — driven by the dashboard card; listed for reference.
# ---------------------------------------------------------------------------
meals_set_bl:
  name: Meals — set breakfast/lunch
  description: >-
    Set (or clear) a breakfast or lunch slot for a date. Scope can broadcast the
    pick across today / this week / two weeks.
  fields:
    date:
      name: Date
      description: Target date (YYYY-MM-DD).
      required: true
      selector:
        text:
    slot:
      name: Slot
      description: "'b' for breakfast or 'l' for lunch."
      required: true
      selector:
        select:
          options: ["b", "l"]
    meal_id:
      name: Meal ID
      description: Meal to set; omit/empty to clear the slot.
      selector:
        text:
    scope:
      name: Scope
      description: How far to apply the pick.
      selector:
        select:
          options: ["today", "week", "2weeks"]
meals_set_dinner:
  name: Meals — set dinner
  description: >-
    Set a day's dinner main + sides. The card supplies the resolved variant
    (pizza rotation / taco protein) and the chosen protein.
meals_set_dinner_sides:
  name: Meals — set dinner sides
  description: Update the sides on a planned dinner.
meals_clear_dinner:
  name: Meals — clear dinner
  description: Clear a day's dinner and block theme-night refill for that day.
meals_clear_day:
  name: Meals — clear day
  description: Clear a whole day's meals.
meals_set_rhythm:
  name: Meals — set theme night
  description: >-
    Pin (or clear) a theme night on a weekday (0=Sunday). Available themes:
    pizza, taco, pasta, leftovers. Auto-fills that weekday's dinner.
meals_toggle_fav:
  name: Meals — toggle favourite
  description: Toggle a meal's favourite flag.
meals_add_custom_meal:
  name: Meals — add custom meal
  description: Add a meal to the library (admin-authored or saved from Recipe Ideas).
meals_remove_custom_meal:
  name: Meals — remove custom meal
  description: Remove a custom meal and scrub it from favourites and the plan.
meals_add_ingredient:
  name: Meals — add ingredient
  description: Add a custom pantry ingredient (admin).
meals_remove_ingredient:
  name: Meals — remove ingredient
  description: Remove a custom pantry ingredient.
meals_save_recipe:
  name: Meals — save recipe card
  description: Attach a recipe card (time, serves, ingredients, steps) to a meal.
meals_toggle_have:
  name: Meals — toggle pantry tag
  description: Toggle a "what we have" pantry ingredient tag.
meals_toggle_grocery:
  name: Meals — toggle grocery row
  description: Check or uncheck a grocery-list row.

# ---------------------------------------------------------------------------
# Home Maintenance (v0.8.0) — registered only when the maintenance module is on
# ---------------------------------------------------------------------------
maintenance_add_task:
  name: Maintenance — add task
  description: Add a maintenance task (recurrence + schedule_mode).
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
    schedule_mode:
      name: Schedule mode
      description: from_completion (floats from actual completion) or calendar_anchored (never drifts).
      selector:
        select:
          options: [from_completion, calendar_anchored]
    recurrence:
      name: Recurrence
      description: '{interval, unit} where unit is days/weeks/months/years. Omit for one-shot.'
      selector:
        object:
    seasonal_anchor:
      name: Seasonal anchor
      description: '{month, day} for calendar_anchored tasks.'
      selector:
        object:
maintenance_update_task:
  name: Maintenance — update task
  description: Update fields on a maintenance task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
maintenance_delete_task:
  name: Maintenance — delete task
  description: Delete a maintenance task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
maintenance_complete_task:
  name: Maintenance — complete task
  description: Record a completion (cost/time/products), decrement inventory, advance next_due.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    mode:
      name: Mode
      selector:
        select:
          options: [diy, pro]
    actual_cost:
      name: Actual cost
      selector:
        number:
          min: 0
          mode: box
    result:
      name: Inspect result
      description: For inspect_plan_do tasks — all_good re-arms, needs_work opens the Plan stage.
      selector:
        select:
          options: [all_good, needs_work]
maintenance_snooze_task:
  name: Maintenance — snooze task
  description: Suppress a task until a date (or for N days).
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    days:
      name: Days
      selector:
        number:
          min: 1
          mode: box
maintenance_reschedule_task:
  name: Maintenance — reschedule task
  description: Move this occurrence to a specific date.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
    next_due:
      name: Next due (YYYY-MM-DD)
      required: true
      selector:
        text:
maintenance_skip_task:
  name: Maintenance — skip task
  description: Skip this occurrence and advance next_due (not recorded as done).
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
maintenance_offer_task:
  name: Maintenance — offer task (bridge)
  description: Publish the task as an external offer for the Chores board (no-op until the D5 bridge).
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
maintenance_revoke_task:
  name: Maintenance — revoke offer
  description: Revoke a previously-offered task.
  fields:
    task_id:
      name: Task ID
      required: true
      selector:
        text:
maintenance_add_product:
  name: Maintenance — add product
  description: Add a product/inventory item.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
maintenance_update_product:
  name: Maintenance — update product
  fields:
    product_id:
      name: Product ID
      required: true
      selector:
        text:
maintenance_delete_product:
  name: Maintenance — delete product
  fields:
    product_id:
      name: Product ID
      required: true
      selector:
        text:
maintenance_adjust_inventory:
  name: Maintenance — adjust inventory
  description: Add or subtract stock (delta can be negative).
  fields:
    product_id:
      name: Product ID
      required: true
      selector:
        text:
    delta:
      name: Delta
      required: true
      selector:
        number:
          mode: box
maintenance_add_vendor:
  name: Maintenance — add vendor
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
maintenance_update_vendor:
  name: Maintenance — update vendor
  fields:
    vendor_id:
      name: Vendor ID
      required: true
      selector:
        text:
maintenance_delete_vendor:
  name: Maintenance — delete vendor
  fields:
    vendor_id:
      name: Vendor ID
      required: true
      selector:
        text:
maintenance_update_fund:
  name: Maintenance — update fund
  description: Create or update a sinking/emergency fund (manual ledger).
  fields:
    fund_id:
      name: Fund ID (blank to create)
      selector:
        text:
    fund_type:
      name: Fund type
      selector:
        select:
          options: [sinking, emergency]
maintenance_update_home_profile:
  name: Maintenance — update home profile
  description: >-
    Update Home Profile answers and re-apply the seed library. Newly-applicable
    tasks are added or re-enabled; tasks that no longer apply are disabled with a
    reason (never deleted, so completion history survives). Send only the fields
    you are changing.
  fields:
    climate_preset:
      name: Climate preset
      description: Selects the climate overrides applied to seed tasks.
      selector:
        select:
          options: [desert_southwest]
    water_heater_type:
      name: Water heater type
      selector:
        select:
          options: [tank, tankless]
    water_source:
      name: Water source
      selector:
        select:
          options: [municipal, well]
    roof_type:
      name: Roof type
      selector:
        select:
          options: [tile, shingle]
    heating_type:
      name: Primary heating
      selector:
        select:
          options: [gas_furnace, heat_pump, electric]
    dryer_fuel:
      name: Dryer fuel
      selector:
        select:
          options: [gas, electric]
    fireplace_fuel:
      name: Fireplace fuel
      selector:
        select:
          options: [wood, gas]
    water_heater_fuel:
      name: Water heater fuel
      selector:
        select:
          options: [gas, electric]
    gas_range:
      name: Gas range
      selector:
        boolean:
    gas_service:
      name: Gas service (leave unset to derive)
      description: >-
        Derived from the fuel answers when unset — any gas appliance or gas heat
        means the home has gas/propane service.
      selector:
        boolean:
    pool:
      name: Pool
      selector:
        boolean:
    softener:
      name: Water softener
      selector:
        boolean:
    ro:
      name: RO system
      selector:
        boolean:
    fireplace:
      name: Fireplace
      selector:
        boolean:
    gutters:
      name: Gutters
      selector:
        boolean:
    septic:
      name: Septic system
      selector:
        boolean:
    carpet:
      name: Carpet
      selector:
        boolean:
    sump_pump:
      name: Sump pump
      selector:
        boolean:
    irrigation:
      name: Irrigation system
      selector:
        boolean:
    lawn:
      name: Lawn
      selector:
        boolean:
    wood_deck:
      name: Wood deck
      selector:
        boolean:
    wood_fence:
      name: Wood fence
      selector:
        boolean:
    stone_counters:
      name: Natural-stone counters
      selector:
        boolean:
    tile_surfaces:
      name: Tiled surfaces
      selector:
        boolean:
    humidifier:
      name: Whole-house humidifier
      selector:
        boolean:
    mini_split:
      name: Mini-split units
      selector:
        boolean:
    generator:
      name: Standby/portable generator
      selector:
        boolean:
    evap_cooler:
      name: Evaporative cooler
      selector:
        boolean:
    hoa:
      name: HOA
      selector:
        boolean:
    year_built:
      name: Year built
      selector:
        number:
          min: 1800
          max: 2100
          mode: box
    sq_ft:
      name: Square feet
      selector:
        number:
          min: 0
          max: 20000
          mode: box
    stories:
      name: Stories
      selector:
        number:
          min: 1
          max: 4
          mode: box
    home_value:
      name: Home value
      selector:
        number:
          min: 0
          max: 10000000
          mode: box
    inflation_rate:
      name: Escalation rate (%/yr)
      description: Sinking-fund projection assumption. Default 4.0.
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          mode: box
    hvac_filter_size:
      name: HVAC filter size
      selector:
        text:
    hvac_filter_count:
      name: HVAC filter count
      selector:
        number:
          min: 0
          max: 20
          mode: box
maintenance_apply_seeds:
  name: Maintenance — apply seed library
  description: >-
    Re-evaluate the seed library against the current Home Profile. Idempotent —
    adds, re-enables, disables and refreshes as needed; never deletes.
